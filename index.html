<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./root.css">
  <link rel="stylesheet" href="./mobie.css">
  <title>Frontend Mentor | Weather app</title>
</head>
<body>
  </section>
  <header>
      <div class="img-container">
        <img src="./assets/images/logo.svg" alt="logo-Weather-App">
      </div>
      <div class="dropdown">
        <button id="dropdownBtn" class="dropdown-btn"><img class="img-unit" src="./assets/images/icon-units.svg">Units <img class="img-drop" src="./assets/images/icon-dropdown.svg" alt="dropdown"></button>
        <div id="dropdownMenu" class="dropdown-menu">
          <button class="close-dropdown">x</button>
          <h2>imperial </h2>
            <div>
              <h4>Temperature</h4>
              <button id="btnFarenheit">Farenheit(F°)</button>
            </div>
            <hr>
            <div>
              <h4>Wind Speed</h4>
              <button id="btnKm">Km/h</button>
            </div>
            <hr>
            <div>
              <h4>Precipitation</h4>
              <div>Milimeters(mm)</div>
            </div>
        </div>
      </div>

    </header>

    <section id="api-error-state" class="invisible">
      <div>
        <img src="./assets/images/icon-error.svg" alt="">
      </div>
      <h1>Something Went Wrong</h1>
      <h4>we couldn't connect to the server (API error). Please try
        <br>
        again in a few moments.
      </h4>
      <button id="retry"><img class="img-retry" src="./assets/images/icon-retry.svg" alt="retry">Retry</button>
    </section>


    <section class="input-section section">
      <div class="question-input-container">How's the sky looking today?</div>
  
      <div class="input-container">
        <img src="./assets/images/icon-search.svg" alt="Search">
        <input id="cityInput" type="text" placeholder="Search for a place...">
        <button id="saveBtn">Search</button>
        <div id="suggestions" class="suggestions"></div>
      </div>
    </section>

    <section class="grid-weather section">

      <article id="main-screen" class="loading-state container main-screen">
        <div class="city-data">
          <h2 id="city"></h2>
          <h4 id="date"></h4>
        </div>
        <div class="c-weather loading-state div">
          <img src="" alt="">
          <div id="temperature" class="tempera loading-state text">Loading...</div>
        </div>
      </article>

      <article class="current-data">
        
        <div class="data-card">
          <h3>Feels like</h3>
          <div id="feels-like">-</div>
        </div>
        <div class="data-card">
          <h3>Humidity</h3>
          <div id="humidity">-</div>
        </div>
        <div class="data-card">
          <h3>Wind</h3>
          <div id="wind">-</div>
        </div>
        <div class="data-card">
          <h3>Precipitation</h3>
          <div id="precipitation">-</div>
        </div>
        
      </article>

      <article class="future-data">
        <h2>Daily forecast</h2>
        <div>

          <div class="data-card-daily">
            <div class="day"></div>
            <img src="" >
            <div class="min-grade"></div>
            <div class="max-grade"></div>
          </div>
          <div class="data-card-daily">
            <div class="day"></div>
            <img src="" >
            <div class="min-grade"></div>
            <div class="max-grade"></div>
          </div>
          <div class="data-card-daily">
            <div class="day"></div>
            <img src="" >
            <div class="min-grade"></div>
            <div class="max-grade"></div>
          </div>
          <div class="data-card-daily">
            <div class="day"></div>
            <img src="" >
            <div class="min-grade"></div>
            <div class="max-grade"></div>
          </div>
          <div class="data-card-daily">
            <div class="day"></div>
            <img src="" >
            <div class="min-grade"></div>
            <div class="max-grade"></div>
          </div>
          <div class="data-card-daily">
            <div class="day"></div>
            <img src="" >
            <div class="min-grade"></div>
            <div class="max-grade"></div>
          </div>
          <div class="data-card-daily">
            <div class="day"></div>
            <img src="" >
            <div class="min-grade"></div>
            <div class="max-grade"></div>
          </div>

        </div>


      </article>
      <article class="hourly-future-data">
        <div class="hourly-title">
          <h2>Hourly Forecast</h2>
          <button id="dropdownDayButton">Units
             <img src="./assets/images/icon-dropdown.svg" alt="dropdown">
          </button>
          <div id="dropdownDayMenu" class="dropdown-day-menu">
            <button class="close-dropdown">x</button>
            <button class="day-btn" data-day="monday">Monday</button>
            <button class="day-btn" data-day="tuesday">Tuesday</button>
            <button class="day-btn" data-day="wednesday">Wednesday</button>
            <button class="day-btn" data-day="thursday">Thursday</button>
            <button class="day-btn" data-day="friday">Friday</button>
            <button class="day-btn" data-day="saturday">Saturday</button>
            <button class="day-btn" data-day="sunday">Sunday</button>
          </div>
        </div>
        <div class="hourly-container">
          
          <div class="hourly-block">
            <div>
              <img src="" alt="">
              <div class="hour"></div>
            </div>
            <div class="hour-grade"></div>
          </div>
          <div class="hourly-block">
            <div>
              <img src="" alt="">
              <div class="hour"></div>
            </div>
            <div class="hour-grade"></div>
          </div>
          <div class="hourly-block">
            <div>
              <img src="" alt="">

            </div>
            <div class="hour-grade"></div>
          </div>

            <div>
              <img src="" alt="">
              <div class="hour"></div>
            </div>
            <div class="hour-grade"></div>
          </div>
          <div class="hourly-block">
            <div>

              <div class="hour"></div>
            </div>
            <div class="hour-grade"></div>
          </div>
          <div class="hourly-block">
            <div>
              <img src="" alt="">
              <div class="hour"></div>
            </div>
            <div class="hour-grade"></div>
          </div>
          <div class="hourly-block">
            <div>
              <img src="" alt="">
              <div class="hour"></div>
            </div>
            <div class="hour-grade"></div>
          </div>
          <div class="hourly-block">
            <div>
              <img src="" alt="">
              <div class="hour"></div>
            </div>
            <div class="hour-grade"></div>
          </div>

        </div>
      </article>


    </section>
</body>
<script src="./index.js"></script>
</html>
